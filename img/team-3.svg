<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- background -->
  <rect width="300" height="300" fill="#e8f5e9" rx="16"/>
  <!-- dashed circle border -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="#a5d6a7" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- plus / join icon background circle -->
  <circle cx="150" cy="130" r="72" fill="#c8e6c9"/>
  <!-- person silhouette -->
  <circle cx="150" cy="108" r="28" fill="#66bb6a"/>
  <ellipse cx="150" cy="176" rx="46" ry="30" fill="#66bb6a"/>
  <!-- plus icon overlay -->
  <rect x="140" y="88" width="20" height="60" rx="8" fill="white" opacity="0.88"/>
  <rect x="120" y="108" width="60" height="20" rx="8" fill="white" opacity="0.88"/>
  <!-- label -->
  <text x="150" y="238" font-size="18" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="#2e7d32" text-anchor="middle">انضم إلينا</text>
</svg>
